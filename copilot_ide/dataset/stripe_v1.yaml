openapi: 3.0.3
info:
  title: Stripe Payments API
  version: v1
  description: B2B Payment processing API for charges, refunds, and subscriptions.
servers:
- url: https://api.stripe.com/v1
paths:
  /charges:
    post:
      summary: Create a charge
      description: To charge a credit card or other payment source, you create a Charge
        object.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                amount:
                  type: integer
                  description: Amount intended to be collected by this payment. A
                    positive integer representing how much to charge in the smallest
                    currency unit (e.g., 100 cents to charge $1.00).
                currency:
                  type: string
                  description: Three-letter ISO currency code, in lowercase. Must
                    be a supported currency.
                source:
                  type: string
                  description: A payment source to be charged. This can be the ID
                    of a card, a bank account, or a token.
              required:
              - amount
              - currency
      responses:
        '200':
          description: Successful response.
  /refunds:
    post:
      summary: Create a refund
      description: When you create a new refund, you must specify a Charge or a PaymentIntent
        object on which to create it.
      security:
      - bearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
        description: Safely retry requests without accidentally performing the same
          operation twice.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                charge:
                  type: string
                  description: The identifier of the charge to refund.
                amount:
                  type: integer
                  description: A positive integer in cents representing how much of
                    this charge to refund.
      responses:
        '200':
          description: Refund created.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
