services:
  # 1. Ingestion & Schema Microservice
  ingestion-service:
    build:
      context: ./services/ingestion_service
      dockerfile: Dockerfile
    container_name: apicopilot-ingestion
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ./dataset:/dataset:ro
      - ./services/ingestion_service/app:/app/app
    environment:
      - PORT=8002
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
    networks:
      - apicopilot-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

  # 2. RAG & Hybrid Search Microservice
  rag-service:
    build:
      context: ./services/rag_service
      dockerfile: Dockerfile
    container_name: apicopilot-rag
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - rag_data:/app/data
      - ./services/rag_service/app:/app/app
    environment:
      - PORT=8001
      - HOST=0.0.0.0
      - INGESTION_SERVICE_URL=http://ingestion-service:8002
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - CROSS_ENCODER_MODEL=cross-encoder/ms-marco-MiniLM-L-6-v2
      - PYTHONUNBUFFERED=1
    depends_on:
      ingestion-service:
        condition: service_healthy
    networks:
      - apicopilot-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # 3. Orchestrator Gateway Microservice
  orchestrator-service:
    build:
      context: ./services/orchestrator_service
      dockerfile: Dockerfile
    container_name: apicopilot-orchestrator
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
      - ../conformance:/workspace/conformance:ro
      - ../shared:/workspace/shared:ro
      - ./services/orchestrator_service/app:/app/app
      - /mnt/c:/mnt/c
      - /mnt/d:/mnt/d
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - RAG_SERVICE_URL=http://rag-service:8001
      - INGESTION_SERVICE_URL=http://ingestion-service:8002
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_HOST=http://host.docker.internal:11434
      - DEFAULT_MODEL=gemma3:4b
      - OLLAMA_MODEL=gemma3:4b
      - DEFAULT_WORKSPACE_DIR=/workspace
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - rag-service
      - ingestion-service
    networks:
      - apicopilot-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

  # 4. Next.js UI Frontend
  ui-service:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: apicopilot-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./frontend/package.json
    depends_on:
      - orchestrator-service
    networks:
      - apicopilot-net

  # 5. Evaluation Microservice
  evaluation-service:
    build:
      context: ./services/evaluation_service
      dockerfile: Dockerfile
    container_name: apicopilot-evaluation
    restart: unless-stopped
    ports:
      - "8003:8003"
    volumes:
      - ./services/evaluation_service/app:/app/app
    environment:
      - PORT=8003
      - HOST=0.0.0.0
      - OLLAMA_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - apicopilot-net



volumes:
  rag_data:
    driver: local

networks:
  apicopilot-net:
    driver: bridge
