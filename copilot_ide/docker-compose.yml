services:
  # 1. Ingestion & Schema Microservice
  ingestion-service:
    build:
      context: ./services/ingestion_service
      dockerfile: Dockerfile
    container_name: apicopilot-ingestion
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ./dataset:/dataset:ro
      - ./services/ingestion_service/app:/app/app
    environment:
      - PORT=8002
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
    networks:
      - apicopilot-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

  # 2. RAG & Hybrid Search Microservice
  rag-service:
    build:
      context: ./services/rag_service
      dockerfile: Dockerfile
    container_name: apicopilot-rag
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - rag_data:/app/data
      - rag_hf_cache:/root/.cache/huggingface
      - ./services/rag_service/app:/app/app
    environment:
      - PORT=8001
      - HOST=0.0.0.0
      - INGESTION_SERVICE_URL=http://ingestion-service:8002
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - CROSS_ENCODER_MODEL=cross-encoder/ms-marco-MiniLM-L-6-v2
      - PYTHONUNBUFFERED=1
    depends_on:
      ingestion-service:
        condition: service_healthy
    networks:
      - apicopilot-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # 3. Orchestrator Gateway Microservice
  orchestrator-service:
    build:
      context: ./services/orchestrator_service
      dockerfile: Dockerfile
    container_name: apicopilot-orchestrator
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
      - ../conformance:/workspace/conformance:ro
      - ../shared:/workspace/shared:ro
      - ../test_codebases:/archon_repo/test_codebases:ro
      - ./services/orchestrator_service/app:/app/app
      # Host user folders for external repo scanning. Windows default; WSL/Linux set HOST_USERS_DIR=/mnt/c/Users in .env
      - ${HOST_USERS_DIR:-C:\Users}:/mnt/c/Users:ro
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - RAG_SERVICE_URL=http://rag-service:8001
      - INGESTION_SERVICE_URL=http://ingestion-service:8002
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_HOST=http://host.docker.internal:11434
      - DEFAULT_MODEL=gemma3:4b
      - OLLAMA_MODEL=gemma3:4b
      - DEFAULT_WORKSPACE_DIR=/workspace
      - OMNIKEY_API_KEY=${OMNIKEY_API_KEY:-}
      # Conformance layer classifier: Kev-9B on the college GPU via the kev-agent's ssh tunnel, Groq fallback
      - KEV_URL=${KEV_URL:-http://kev-agent:8009}
      - KEV_AGENT_URL=${KEV_AGENT_URL:-http://kev-agent:7338}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_API_KEY_2=${GROQ_API_KEY_2:-}
      - FREELLMAPI_API_KEY=${FREELLMAPI_API_KEY:-}
      - FREELLMAPI_BASE_URL=${FREELLMAPI_BASE_URL:-}
      - FREELLMAPI_MODEL=${FREELLMAPI_MODEL:-}
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - rag-service
      - ingestion-service
    networks:
      - apicopilot-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

  # 4. Next.js UI Frontend
  ui-service:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: apicopilot-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_ARCGEN_API_URL=http://localhost:8004
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./frontend/package.json
    depends_on:
      - orchestrator-service
      - arcgen-service
    networks:
      - apicopilot-net

  # 5. ArcGen Microservice (SRS / prompt -> architecture)
  arcgen-service:
    build:
      context: ./services/arcgen_service
      dockerfile: Dockerfile
    container_name: apicopilot-arcgen
    restart: unless-stopped
    ports:
      - "8004:8004"
    volumes:
      - ./services/arcgen_service/app:/app/app
      - .:/workspace
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8004
      - HOST=0.0.0.0
      - OLLAMA_URL=http://host.docker.internal:11434
      # LLM choice + API keys saved from the ArcGen UI; on the host mount so they survive rebuilds (gitignored output/)
      - ARCGEN_SETTINGS_PATH=/workspace/services/arcgen_service/output/llm_settings.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - apicopilot-net

  # 5b. Evaluation Microservice
  evaluation-service:
    build:
      context: ./services/evaluation_service
      dockerfile: Dockerfile
    container_name: apicopilot-evaluation
    restart: unless-stopped
    ports:
      - "8003:8003"
    volumes:
      - ./services/evaluation_service/app:/app/app
    environment:
      - PORT=8003
      - HOST=0.0.0.0
      - OLLAMA_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - apicopilot-net



  # 6. Kev GPU agent (profile "gpu"): one-click start/stop of the Kev-9B server on the college GPU
  #    and the ssh tunnel to it. On apicopilot-net, so the orchestrator reaches it as kev-agent:7338
  #    (control) and kev-agent:8009 (tunnelled Kev server); both also published on the host's loopback
  #    for native runs (KEV_URL=http://127.0.0.1:8009).
  #    Start it: COMPOSE_PROFILES=gpu, CLF_HOST (user@head-node) and KEV_SSH_DIR (Windows path, e.g.
  #    C:/Users/<you>/.ssh, holding id_ed25519 + known_hosts) in copilot_ide/.env, then `docker compose up -d`.
  kev-agent:
    build:
      context: ./services/kev_agent
    container_name: apicopilot-kev-agent
    restart: unless-stopped
    profiles: ["gpu"]
    ports:
      - "127.0.0.1:7338:7338"
      - "127.0.0.1:8009:8009"
    networks:
      - apicopilot-net
    environment:
      - CLF_HOST=${CLF_HOST:-}
      - AGENT_BIND=0.0.0.0
    volumes:
      - ${KEV_SSH_DIR:-./.no-ssh}:/keys:ro
      - ../experiments/classifier_eval/gpu:/gpu:ro

volumes:
  rag_data:
    driver: local
  rag_hf_cache:
    driver: local

networks:
  apicopilot-net:
    driver: bridge
