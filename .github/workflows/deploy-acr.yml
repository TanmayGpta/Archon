name: Build and Push Images to Azure ACR

on:
  push:
    branches:
      - agai-dev
  workflow_dispatch:

jobs:
  build-and-push-backend:
    name: Build & Push Backend Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: archonregistery-ahhzb5aedsa5fdae.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: archon_agai/deploy/Dockerfile
          push: true
          tags: archonregistery-ahhzb5aedsa5fdae.azurecr.io/archon-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-frontend:
    name: Build & Push Frontend Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: archonregistery-ahhzb5aedsa5fdae.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./copilot_ide/frontend
          file: ./copilot_ide/frontend/Dockerfile
          push: true
          tags: archonregistery-ahhzb5aedsa5fdae.azurecr.io/archon-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
