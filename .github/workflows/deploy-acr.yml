name: Build and Push Images to Azure ACR

on:
  push:
    branches:
      - agai-dev
  workflow_dispatch:

jobs:
  build-and-push-backend:
    name: Build & Push Backend Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: archonregistery-ahhzb5aedsa5fdae.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: archon_agai/deploy/Dockerfile
          push: true
          tags: |
            archonregistery-ahhzb5aedsa5fdae.azurecr.io/archon-backend:latest
            archonregistery-ahhzb5aedsa5fdae.azurecr.io/archon-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print Backend Image Tag
        run: |
          echo "### Backend image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "archonregistery-ahhzb5aedsa5fdae.azurecr.io/archon-backend:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy locally: ./archon_agai/deploy/update-containerapps.ps1 -Sha ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  build-and-push-frontend:
    name: Build & Push Frontend Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: archonregistery-ahhzb5aedsa5fdae.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./copilot_ide/frontend
          file: ./copilot_ide/frontend/Dockerfile
          push: true
          tags: |
            archonregistery-ahhzb5aedsa5fdae.azurecr.io/archon-frontend:latest
            archonregistery-ahhzb5aedsa5fdae.azurecr.io/archon-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_AGAI_API_URL=https://archon-agai-backend.wittymeadow-d0c20aa4.eastasia.azurecontainerapps.io
            NEXT_PUBLIC_API_URL=https://archon-agai-backend.wittymeadow-d0c20aa4.eastasia.azurecontainerapps.io
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print Frontend Image Tag
        run: |
          echo "### Frontend image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "archonregistery-ahhzb5aedsa5fdae.azurecr.io/archon-frontend:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
