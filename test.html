
    <!DOCTYPE html>
    <html>
    <head>
        <title>Archon - Architecture Dependency Graph</title>
        <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
        <style type="text/css">
            body {
                margin: 0; padding: 0;
                background-color: #1e1e1e;
                color: white;
                font-family: 'Segoe UI', sans-serif;
            }
            #mynetwork {
                width: 100vw;
                height: 100vh;
            }
            #legend {
                position: absolute;
                top: 15px; left: 15px;
                background: rgba(0,0,0,0.75);
                padding: 14px 18px;
                border-radius: 10px;
                border: 1px solid #444;
                z-index: 10;
                min-width: 220px;
            }
            #legend h3 { margin: 0 0 5px 0; font-size: 16px; }
            .legend-item { display: flex; align-items: center; margin: 6px 0; font-size: 13px; }
            .legend-dot { width: 14px; height: 14px; border-radius: 50%; margin-right: 10px; flex-shrink: 0; }
        </style>
    </head>
    <body>
        <div id="legend">
            <h3>Archon Reality Graph</h3>
        <div class="legend-item">
            <div class="legend-dot" style="background:#2980b9;"></div>
            Internal Modules (1)
        </div>
        
        <hr style="border-color:#444; margin: 10px 0;">
        <div class="legend-item">
            <div class="legend-dot" style="background:#e67e22;"></div>
            External Packages (0)
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background:#7f8c8d;"></div>
            Standard Library (0)
        </div>
    
        </div>
        <div id="mynetwork"></div>

        <script type="text/javascript">
            var nodes = new vis.DataSet([{"id": "test", "label": "test", "title": "<b>test</b><br>Group: Internal Module", "color": {"background": "#2980b9", "border": "#2980b9"}, "size": 18, "shape": "dot", "borderWidth": 1, "font": {"color": "#ffffff", "size": 16, "face": "Arial Black"}, "shadow": true, "group": "Internal Module"}]);
            var edges = new vis.DataSet([]);

            var container = document.getElementById('mynetwork');
            var data = { nodes: nodes, edges: edges };

            var options = {
                nodes: {
                    shadow: true
                },
                edges: {
                    smooth: { type: 'continuous' },
                    width: 1.5
                },
                physics: {
                    forceAtlas2Based: {
                        gravitationalConstant: -50,
                        centralGravity: 0.005,
                        springLength: 230,
                        springConstant: 0.18,
                    },
                    maxVelocity: 146,
                    solver: 'forceAtlas2Based',
                    timestep: 0.35,
                    stabilization: { iterations: 150 }
                },
                interaction: {
                    hover: true,
                    tooltipDelay: 150,
                    navigationButtons: true,
                    keyboard: true
                }
            };

            var network = new vis.Network(container, data, options);
        </script>
    </body>
    </html>
